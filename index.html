<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>치이카와: 인어섬의 비밀</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Segoe UI',sans-serif;background:#d6f4f2;color:#293d55}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible{outline:4px solid #ef6b9b;outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:2px solid white;background:#ffffffd9;border-radius:30px;padding:8px 14px;font-weight:900;box-shadow:0 4px 15px #427b7d22}
.main{background:#fffffff0;border:4px solid #fff;border-radius:26px;overflow:hidden;box-shadow:0 16px 60px #3d7a8b4d;position:relative}
.btn{background:#ed6697;color:white;border:0;border-radius:15px;padding:12px 19px;font-weight:900;box-shadow:0 5px #b83e72}
.btn:disabled{opacity:.45}
.btn.alt{background:#eff9ff;color:#2c6684;box-shadow:none;border:2px solid #a8d8e5}
.btn.sm{padding:8px 13px;border-radius:12px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- 인트로 ---------- */
.intro{padding:20px}
.title{text-align:center;font-size:clamp(28px,5vw,50px);color:#e34c84;text-shadow:2px 3px white;margin:10px 0}
.subtitle{text-align:center;line-height:1.7}
.islandHero{height:235px;position:relative;background:#7cd7e8 url('backgrounds/island.webp') center/cover;border-radius:20px}
.islandHero .flag{position:absolute;bottom:14px;left:14px;background:#fffdef;padding:11px 15px;border-radius:15px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.character{border:3px solid #d7e6e9;border-radius:18px;background:#fff;min-height:150px;padding:8px;display:grid;justify-items:center;align-content:center;gap:8px;font-weight:900}
.character img{width:100%;max-width:125px;height:100px;object-fit:contain}
.character.selected{background:#fff0f6;border-color:#ed6697;transform:translateY(-3px)}

/* ---------- 지도 ---------- */
.mapScreen{position:relative}
.mapScreen .mapArea{background:#49b7d8}
.mapWrap{position:relative;width:min(100%,calc((100vh - 245px)*10/7));min-width:62%;margin:auto;aspect-ratio:10/7;background:#49b7d8;overflow:hidden;touch-action:manipulation}
.mapWrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sign{position:absolute;transform:translate(-50%,-100%);background:#fffdf2;border:3px solid #c99c67;border-radius:12px;padding:4px 9px 3px;font-weight:900;font-size:clamp(10px,1.5vw,16px);color:#5d4524;box-shadow:0 4px 10px #1d3c4e55;white-space:nowrap;line-height:1.25;text-align:center;z-index:5;pointer-events:none}
.sign .em{display:block;font-size:1.35em}
button.sign{pointer-events:auto;cursor:pointer}
.sign.decoy{background:#f2f4f4;border-color:#9fb3b8;color:#51686e}
.sign.pick{animation:pulse 1.1s infinite;border-color:#ed6697;z-index:8}
.sign.here{border-color:#2fa06c;background:#eafff3;transform:translate(-50%,24%);z-index:6}
.sign.dim{opacity:.55;filter:saturate(.45)}
.sign.done:after{content:'✔';position:absolute;top:-10px;right:-9px;background:#2fa06c;color:#fff;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:19px}
@keyframes pulse{0%,100%{transform:translate(-50%,-100%) scale(1);box-shadow:0 0 0 0 #ed669788}60%{transform:translate(-50%,-100%) scale(1.07);box-shadow:0 0 0 12px #ed669700}}
.mapHero{position:absolute;width:9.5%;max-width:92px;transform:translate(-50%,-88%);z-index:10;pointer-events:none;transition:none}
.mapHero img{width:100%;display:block;filter:drop-shadow(2px 6px 4px #10305377)}
.mapHero .ride{position:absolute;left:50%;bottom:-14%;transform:translateX(-50%);font-size:clamp(26px,4.5vw,46px);line-height:1;filter:drop-shadow(0 4px 4px #2347)}
.blocker{position:absolute;width:11%;max-width:105px;transform:translate(-50%,-80%) scale(0);z-index:11;pointer-events:none}
.blocker img{width:100%;filter:drop-shadow(2px 6px 5px #45265577)}
.blocker.on{animation:popin .45s forwards}
@keyframes popin{60%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-80%) scale(1)}}
.bubble{position:absolute;transform:translate(-50%,-240%);background:#fff;border:3px solid #35506b;border-radius:14px;padding:7px 11px;font-weight:900;font-size:clamp(11px,1.7vw,16px);z-index:12;white-space:nowrap;box-shadow:0 5px 14px #16304555}
.bubble:after{content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid #35506b}
.step{position:absolute;width:7px;height:7px;border-radius:50%;background:#7c5c3c88;transform:translate(-50%,-50%);z-index:4;animation:stepfade 1.4s forwards;pointer-events:none}
.step.wet{background:#ffffffaa;width:12px;height:12px;animation:ripple 1.2s forwards}
@keyframes stepfade{to{opacity:0}}
@keyframes ripple{to{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-7px}50%{margin-left:7px}75%{margin-left:-4px}}

/* 지도 아래 미션 바 */
.mission{display:flex;flex-direction:column;gap:8px;padding:13px 16px;background:linear-gradient(#fff,#f1faff)}
.mClue{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mFeed{min-height:22px;font-weight:900;color:#bd3e6d}
.mFeed.ok{color:#148566}
.hintText{background:#eaf5fa;border-radius:10px;padding:8px 12px;line-height:1.55;font-size:14px;display:none}
.hintText.on{display:block}

/* ---------- 장면 ---------- */
.sceneOv{display:flex;flex-direction:column;background:#0b2335}
.sceneVis{position:relative;height:clamp(300px,54vh,580px);overflow:hidden;background:center/cover}
.sceneVis:after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#122a4080);pointer-events:none}
.sceneName{position:absolute;top:12px;left:12px;background:#ffffffe6;border:2px solid #fff;padding:8px 13px;border-radius:13px;font-weight:900;z-index:3}
.signpost{transition:opacity .45s,transform .45s}
.signpost .plank{position:relative;background:linear-gradient(#cb9d64,#ab7a42);border:3px solid #7c5630;border-radius:11px;box-shadow:0 6px 16px #192e3d66,inset 0 2px 0 #e6c08a,inset 0 -3px 0 #8a6134;color:#fff8ec;font-weight:900;text-shadow:0 2px 2px #00000066;padding:12px 24px;font-size:clamp(15px,2.3vw,22px);line-height:1.45}
.signpost .plank:before,.signpost .plank:after{content:'';position:absolute;top:9px;width:9px;height:9px;border-radius:50%;background:#5e3f20;box-shadow:inset 0 2px 2px #00000077}
.signpost .plank:before{left:9px}.signpost .plank:after{right:9px}
.signpost .pole{width:13px;height:30px;margin:-2px auto 0;background:linear-gradient(90deg,#9a6c3a,#6e4b26);border:2px solid #5e3f20;border-top:0;border-radius:0 0 6px 6px}
/* 손그림 표지판: 그림 자체에 나무틀이 있어 액자를 덧대지 않는다 */
.signpost.pic{display:block}
.signpost.pic img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 14px 40px #0b1f33aa,0 0 0 3px #ffffffcc}
.signpost.scene{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:min(78%,560px)}
.signpost.scene.pic{width:min(72%,560px);max-height:70%}
.signpost.scene.pic img{max-height:100%;width:auto;max-width:100%;margin:0 auto;object-fit:contain}
.signpost.map{margin:4px auto 0;width:fit-content;max-width:96%}
.signpost.map.pic{width:min(92%,520px)}
.signpost.map .pole{height:16px}
.signpost.gone{opacity:0;pointer-events:none}
.signpost.scene.gone{transform:translate(-50%,-56%) scale(.94)}
.signCount{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#0d2338e0;color:#fff;font-weight:900;font-size:14px;padding:4px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px #0006}
.signpost.map{text-align:center}
.signpost.map .signCount{position:static;display:inline-block;bottom:auto;left:auto;right:auto;transform:none;margin-top:7px;font-size:13px;padding:3px 11px}
.sorryBtn{position:absolute;z-index:7;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
.sorryBtn.on{display:inline-block}
.mission .sorryBtn{position:static;transform:none;margin:6px auto}
.signArea{display:flex;flex-direction:column;align-items:center;position:relative}
.sceneMon{position:absolute;right:6%;bottom:10%;z-index:2;max-height:52%;max-width:40%;object-fit:contain;filter:drop-shadow(3px 9px 6px #15274388);animation:monIn .7s ease-out;transform-origin:bottom center}
@keyframes monIn{0%{transform:translateY(30px) scale(.6);opacity:0}70%{transform:translateY(-8px) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
.sceneMon.bounce{animation:monBounce 2.6s ease-in-out infinite .7s}
@keyframes monBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sceneHero{position:absolute;left:-20%;bottom:5%;z-index:2;height:34%;max-width:30%;object-fit:contain;filter:drop-shadow(2px 7px 5px #102e5377)}
.sceneHero.in{animation:walkin 1.4s forwards}
.sceneHero.stay{left:5%;animation:bob 2.6s ease-in-out infinite}
@keyframes walkin{0%{left:-20%;transform:rotate(0)}20%{transform:rotate(3deg)}40%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-3deg)}100%{left:5%;transform:rotate(0)}}
@keyframes bob{50%{transform:translateY(-9px)}}
.scenePanel{background:linear-gradient(#fff,#f3fbff);padding:14px 18px;display:flex;flex-direction:column;gap:9px}
.scenePanel .story{line-height:1.65}
.sceneQ{background:#fff4d9;border-left:6px solid #efbd64;border-radius:11px;padding:10px 13px;font-weight:900;font-size:clamp(15px,2.2vw,20px)}
.options{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.option{width:100%;text-align:left;background:#f5fbff;border:2px solid #bad7e5;color:#294d66;border-radius:12px;padding:11px 13px;font-weight:800;line-height:1.45;font-size:clamp(14px,2vw,18px)}
.option:hover{background:#e5f5fd;border-color:#76b5d4}
.feedback{min-height:24px;font-weight:900;color:#bd3e6d}
.feedback.ok{color:#148566}
.digitFly{position:absolute;z-index:40;font-size:52px;font-weight:900;color:#e34c84;text-shadow:2px 2px #fff;left:50%;top:40%;animation:digitfly 1.2s forwards;pointer-events:none}
@keyframes digitfly{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.4);opacity:1}70%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-300%) scale(.5);opacity:0}}
.code{width:175px;text-align:center;font-size:30px;letter-spacing:8px;border:3px solid #7bb8d5;border-radius:13px;padding:9px}

/* ---------- 엔딩 ---------- */
.endWrap{position:relative}
.ending{position:relative;aspect-ratio:16/9;max-height:66vh;background:#07192b;overflow:hidden;border-radius:18px;text-align:center;cursor:pointer;transition:opacity 1.4s ease}
.endVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 1.4s ease,filter 1.4s ease}
.ending:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,24,42,.42),transparent 34%,transparent 64%,rgba(6,24,42,.5));pointer-events:none}
.endTitle{position:relative;z-index:2;padding-top:18px;margin:0;color:#fff;font-size:clamp(22px,4.4vw,38px);text-shadow:0 3px 10px #0b2c47,0 1px 0 #3f6f8a;transition:opacity 1.4s ease}
.endSkip{position:absolute;z-index:2;left:0;right:0;bottom:12px;margin:0;color:#dcecf7;font-size:13px;text-shadow:0 2px 8px #06202f;opacity:.85;transition:opacity .6s}
.ending.fading{opacity:0;pointer-events:none}
.ending.fading .endVid{filter:brightness(.2)}
.ending.gone{display:none}
.endAfter{opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.endAfter.show{opacity:1;transform:none;pointer-events:auto}
.footer{font-size:12px;text-align:center;color:#4c7181;padding:13px}
.progress{height:10px;background:#cddde8;border-radius:20px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#75d6ad,#ed77b1);transition:.4s}

/* ---------- 비밀 숫자 공개 ---------- */
.digSheet{max-width:420px}
.digTop{margin:0;color:#2f6b8e;font-weight:900}
.digBig{font-family:var(--display,inherit);font-size:clamp(84px,22vw,132px);line-height:1.05;font-weight:900;color:#e34c84;text-shadow:0 5px 0 #ffd9e7,0 10px 24px #e34c8433;margin:4px 0 6px}
.digWarn{margin:0 0 6px;font-size:17px;color:#9a3d1e;line-height:1.6}
.digSub{margin:0 0 14px;font-size:13px;color:#6b8392}

/* ---------- 비밀번호 키패드 ---------- */
.pad{display:flex;flex-direction:column;align-items:center;gap:14px}
.padBoxes{display:flex;gap:10px}
.padBox{width:52px;height:64px;border-radius:12px;border:3px dashed #9fc6da;background:#f3fbff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#1f5675}
.padBox.on{border-style:solid;border-color:#ed6697;background:#fff;color:#bd3e6d}
.padKeys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,300px)}
.padKey{padding:15px 0;border:0;border-radius:14px;background:#eaf4fa;color:#1f4f6b;font-size:25px;font-weight:900;box-shadow:0 4px 0 #bcd6e4;cursor:pointer}
.padKey:active{transform:translateY(3px);box-shadow:0 1px 0 #bcd6e4}
.padKey.wide{font-size:16px;background:#f3e6ea;color:#92415f;box-shadow:0 4px 0 #dcc3cc}
.padKey.go{font-size:16px;background:#ed6697;color:#fff;box-shadow:0 4px 0 #b83e72}

/* ---------- 단어 퀴즈 / 잡아먹힘 ---------- */
.ov{position:fixed;inset:0;background:#10203bcc;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:22px;padding:20px;max-width:520px;width:100%;box-shadow:0 20px 50px #0a192e88;text-align:center}
.quizSheet h2{margin:4px 0 2px;color:#bd3e6d}
.quizMon{height:92px;object-fit:contain;filter:drop-shadow(2px 5px 4px #3a24504d);animation:monBounce 1.6s ease-in-out infinite}
.qWarn{margin:4px 0;color:#7c2d4a}
.qMean{background:#fff4d9;border:3px solid #e5b96d;border-radius:12px;padding:10px;font-size:20px;margin:10px 0}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.tile{width:44px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;background:#eef6fb;border:2px solid #bad7e5;color:#2a4d66;text-transform:lowercase}
input.tile{text-align:center;background:#fff;border:3px dashed #ed6697;color:#bd3e6d;padding:0}
input.tile:focus{outline:3px solid #ffc9dd;border-style:solid}
.eatOv{background:#2a0f1fe6}
.eatStage{position:relative;width:min(520px,94vw);height:420px;text-align:center}
.eatHero{position:absolute;left:14%;bottom:150px;height:130px;animation:gulp 1.6s forwards}
.eatMon{position:absolute;right:8%;bottom:140px;height:190px;animation:lunge 1.6s forwards;filter:drop-shadow(0 10px 14px #000a)}
.eatSushi{position:absolute;left:26%;bottom:175px;height:110px;transform:translateX(-50%) scale(0);animation:sushiPop .9s 1.7s forwards;filter:drop-shadow(0 8px 10px #0009)}
.eatText{position:absolute;left:0;right:0;bottom:62px;color:#ffe9f1;font-weight:900;font-size:clamp(16px,3vw,21px);line-height:1.6;text-shadow:0 2px 4px #000}
.eatBtn{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);white-space:nowrap}
@keyframes lunge{0%{transform:translateX(40px) scale(.9)}45%{transform:translateX(0) scale(1)}60%{transform:translateX(-120px) scale(1.25) rotate(-8deg)}100%{transform:translateX(-60px) scale(1.1)}}
@keyframes gulp{0%,55%{opacity:1;transform:scale(1)}80%{transform:scale(.5) rotate(20deg)}100%{opacity:0;transform:scale(.1) rotate(90deg)}}
@keyframes sushiPop{0%{transform:translateX(-50%) scale(0) rotate(-180deg)}70%{transform:translateX(-50%) scale(1.15) rotate(8deg)}100%{transform:translateX(-50%) scale(1) rotate(0)}}
.character.eaten{background:#e9e9e9;border-color:#c3c3c3;color:#8a8a8a;cursor:not-allowed}
.character.eaten img{filter:grayscale(1) brightness(1.03);height:105px;width:100%;object-fit:contain}
.character.eaten small{color:#9a9a9a;font-weight:800}
@media(max-width:740px){
 .cards{gap:6px}.character{min-height:114px;font-size:12px}.character img{height:66px}
 .islandHero{height:175px}
 .mapWrap{aspect-ratio:10/8.2}
 .scenePanel{padding:11px 13px}
 .signpost .plank{font-size:14px;padding:10px 18px}
 .signpost.scene.pic{width:82%;max-height:66%}
 .signCount{font-size:12px}
 .sign{font-size:9.5px;padding:3px 6px 2px;border-width:2px}
 .sign .em{font-size:1.25em}
}
@media(max-width:390px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body><div class="wrap">
<header class="top"><span class="chip">🏝️ 치이카와: 인어섬의 비밀</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn alt sm" id="music" onclick="toggleMusic()">🔇 음악 켜기</button> <span class="chip" id="counter">개인 방탈출</span></div></header>
<main id="root" class="main"></main>
<div class="footer">수업용 비공식 팬 제작 게임 · 업로드된 캐릭터 및 몬스터 이미지 활용 · 배경 이미지와 음악은 사용자가 제공한 파일을 포함 · 이미지 저작권은 원 권리자에게 있습니다.</div>
</div><script>
'use strict';
/* ==================== 데이터 ==================== */
const characters=[['치이카와','chiikawa'],['하치와레','hachiware'],['우사기','usagi'],['모몽가','momonga'],['쿠리만쥬','kurimanju'],['랏코','rakko'],['시사','shisa'],['후루혼야','furu']];
const img=n=>'assets/'+n+'.png';

const CODES=[[3,7,1,9],[5,2,8,4],[9,4,6,2],[1,8,3,7],[6,1,9,5],[2,9,4,8],[8,5,2,6],[4,3,7,1]];
function digitFor(sceneId){
 const s=scenes[sceneId];
 if(!s||s.slot===undefined||state===null)return null;
 return String(CODES[state.char][s.slot]);
}

/* 지도 노드 (1000 x 700 좌표계) */
const nodes={
 beach:{x:150,y:555,em:'🏖️',name:'Beach'},
 forest:{x:300,y:465,em:'🌲',name:'Forest'},
 crossroads:{x:455,y:398,em:'🪧',name:'Crossroads'},
 cave:{x:548,y:268,em:'⛰️',name:'Cave'},

 /* 함정(잘못된 길) */

 darkpit:{x:652,y:178,em:'🕳️',name:'Dark Pit',decoy:1},

 whirlpool:{x:770,y:636,em:'🌪️',name:'Whirlpool',decoy:1},
};
/* 길(폴리라인). key: from>to */
const paths={
 'beach>forest':[[150,555],[205,535],[255,500],[300,465]],
 'beach>swamp':[[150,555],[128,500],[118,458],[120,418]],
 'beach>rocks':[[150,555],[105,532],[64,492]],
 'forest>crossroads':[[300,465],[355,438],[405,417],[455,398]],
 'forest>swamp':[[300,465],[232,452],[168,436],[120,418]],
 'forest>rocks':[[300,465],[218,482],[140,492],[64,492]],
 'crossroads>cave':[[455,398],[488,358],[515,315],[548,268]],

/* ==================== 걷기 엔진 ==================== */
function placeHero(x,y){const h=document.getElementById('mapHero');if(h){h.style.left=x/10+'%';h.style.top=y/7+'%'}}
function segLens(pts){const l=[0];for(let i=1;i<pts.length;i++){l.push(l[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}return l}
function pointAt(pts,lens,d){
 for(let i=1;i<pts.length;i++){if(d<=lens[i]){const t=(d-lens[i-1])/(lens[i]-lens[i-1]||1);
  return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t,pts[i][0]-pts[i-1][0]]}}
 const n=pts.length-1;return[pts[n][0],pts[n][1],pts[n][0]-pts[n-1][0]]
}
function walk(pts,opt={}){
 return new Promise(res=>{
  const hero=document.getElementById('mapHero'),hi=document.getElementById('heroImg'),ride=document.getElementById('ride');
  if(!hero){res();return}
  const boat=!!opt.boat;
  if(ride)ride.hidden=!boat;
  const lens=segLens(pts),total=lens[lens.length-1];
  const speed=(opt.speed||(boat?95:130))*(window.__fast||1);
  const dur=total/speed*1000;
  let t0=null,lastStep=0;
  const wrapEl=document.getElementById('mapWrap');
  function frame(ts){
   if(!document.getElementById('mapHero')){res();return}
   if(t0===null)t0=ts;
   const k=Math.min(1,(ts-t0)/dur),d=total*k;
   const[x,y,dx]=pointAt(pts,lens,d);
   placeHero(x,y);
   const bob=Math.sin(d/14)*(boat?2.5:4);
   hi.style.transform=`translateY(${bob}px) rotate(${Math.sin(d/14)*(boat?2:5)}deg) scaleX(${dx<-1?-1:1})`;
   if(d-lastStep>26&&wrapEl){lastStep=d;const s=document.createElement('div');s.className='step'+(boat?' wet':'');s.style.cssText=pct(x,y+16);wrapEl.appendChild(s);setTimeout(()=>s.remove(),1400)}
   if(k<1)requestAnimationFrame(frame);else{hi.style.transform='';if(ride)ride.hidden=true;res()}
  }
  requestAnimationFrame(frame);
 });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms/(window.__fast||1)));

/* ==================== 이동 선택 ==================== */
async function go(dest){
 if(walking||state.phase!=='travel')return;
 const leg=legs[state.leg];
 const key=state.at+'>'+dest;
 const pts=paths[key];
 if(!pts)return;
 walking=true;state.moves++;hud();
 document.querySelectorAll('.sign.pick').forEach(s=>s.classList.add('dim'));
 const feed=document.getElementById('mFeed');feed.className='mFeed';feed.textContent='';
 if(dest===leg.to){
  await walk(pts,{boat:leg.boat});
  state.at=dest;store();
  walking=false;
  feed.className='mFeed ok';feed.textContent='✨ 잘 찾았어요!';
  await sleep(350);
  state.phase='scene';state.scene=dest;store();
  openScene(dest);
 }else{
  /* 잘못된 길: 중간까지 갔다가 몬스터에게 막혀 되돌아온다 */
  const lens=segLens(pts),total=lens[lens.length-1];
  const half=[],steps=18;
  for(let i=0;i<=steps;i++){const[x,y]=pointAt(pts,lens,total*0.52*i/steps);half.push([x,y])}
  await walk(half);
  const[bx,by]=pointAt(pts,lens,total*0.66);
  const blocker=document.getElementById('blocker'),bubble=document.getElementById('bubble');
  blocker.style.cssText=pct(bx,by);blocker.classList.add('on');
  bubble.style.cssText=pct(Math.max(215,Math.min(785,bx)),Math.max(150,by));bubble.hidden=false;bubble.textContent='Sorry? This is not the way! 🙅';
  setMusic('monster');
  document.getElementById('mapHero').classList.add('shake');
  state.wrong++;hud();store();
  await sleep(1500);
  document.getElementById('mapHero').classList.remove('shake');
  blocker.classList.remove('on');bubble.hidden=true;
  setMusic('calm');
  await walk(half.slice().reverse());
  walking=false;
  render();
  const f2=document.getElementById('mFeed');
  if(f2){f2.className='mFeed';f2.textContent='⚠️ 길이 막혔어요! 표지판을 다시 읽고 다른 푯말을 눌러 보세요.'}
  const h2=document.getElementById('hintText');if(h2)h2.classList.add('on');
 }
}
async function autoWalk(){
 const leg=legs[state.leg];
 if(walking)return;walking=true;
 const feed=document.getElementById('mFeed');feed.className='mFeed ok';feed.textContent='🚪 문이 열렸어요! 항구로 달려갑니다!';
 await sleep(500);
 await walk(paths[state.at+'>'+leg.to]);
 state.at=leg.to;state.moves++;state.phase='scene';state.scene=leg.to;store();walking=false;
 openScene(leg.to);
}

/* ==================== 장면 ==================== */
let signTimer=null,signTick=null;
function openScene(id){
 const s=scenes[id];if(!s){toTravel();return}
 setMusic(s.monster?'monster':'calm');
 curOpts=s.opts?s.opts.slice():null;
 if(curOpts)for(let i=curOpts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[curOpts[i],curOpts[j]]=[curOpts[j],curOpts[i]]}
 root.innerHTML='';
 const ov=document.createElement('div');ov.className='sceneOv';
 ov.innerHTML=`<div class="sceneVis" style="background-image:${s.tint?"linear-gradient(rgba(10,26,58,.55),rgba(10,26,58,.55)),":''}url('backgrounds/${s.bg}.webp')">
   <span class="sceneName">${s.title}</span>
   ${signpostHTML(s.sign,(s.intro||s.code)?'scene notimed':'scene',PICS[id]?id:null)}
   <button class="btn sm sorryBtn" id="sorryBtn" onclick="onSorry()">🔁 Sorry? (다시 보기)</button>
   ${s.monster?`<img class="sceneMon bounce" src="${img(s.monster)}" alt="몬스터">`:''}
   <img class="sceneHero in" src="${heroImg()}" alt="${characters[state.char][0]}">
  </div>
  <div class="scenePanel">
   <div class="story">${s.story}</div>
   ${s.q?`<div class="sceneQ">🎯 ${s.q}</div>`:''}
   <div class="options" id="options">${
    s.code?keypadHTML()
    :s.intro?`<button class="btn" onclick="toTravel()">🗺️ 지도를 보고 출발! ➜</button>`
    :curOpts.map((o,i)=>`<button class="option" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o[0]}</button>`).join('')
   }</div>
   <div id="feedback" class="feedback" role="status"></div>
   <div class="story" style="font-size:13px;color:#56707f">🔑 비밀 숫자 ${state.digits.length}/4 · 얻은 숫자는 <b>한 번만</b> 보여 줘요. 종이에 꼭 적어 두세요! · 길을 잘못 골라도 다시 도전할 수 있어요.</div>
  </div>`;
 root.appendChild(ov);
 window.scrollTo(0,0);
 const heroEl=ov.querySelector('.sceneHero');
 heroEl.addEventListener('animationend',()=>{heroEl.classList.remove('in');heroEl.classList.add('stay')},{once:true});
 locked=false;
 clearTimeout(signTimer);clearInterval(signTick);
 const cEl=document.getElementById('signCount');if(cEl)cEl.textContent='';
 if(!s.intro&&!s.code){state.signSorry=0;store();showSignFor(SIGN_T1)}
}
const SIGN_T1=5000,SIGN_T2=3000,SIGN_T3=5000;
function showSignFor(ms){
 const sg=document.getElementById('signBoard'),sb=document.getElementById('sorryBtn');
 if(!sg||!sb)return;
 sg.classList.remove('gone');sb.classList.remove('on');
 clearTimeout(signTimer);clearInterval(signTick);
 const fast=(window.__fast||1),end=Date.now()+ms/fast;
 const cnt=document.getElementById('signCount');
 const paint=()=>{const c=document.getElementById('signCount');if(c)c.textContent='⏱️ '+Math.max(0,Math.ceil((end-Date.now())*fast/1000))+'초'};
 paint();signTick=setInterval(paint,200);
 signTimer=setTimeout(()=>{
  clearInterval(signTick);
  const g=document.getElementById('signBoard'),b=document.getElementById('sorryBtn');
  if(g&&b){g.classList.add('gone');b.classList.add('on');
   b.textContent=(state&&state.signSorry>=2)?'🙏 Sorry?… (⚠️ 또 물어보면 잡아먹혀요)':'🔁 Sorry? (표지판 다시 보기)'}
 },ms/fast);
}
function feedMsg(txt,ok){const el=document.getElementById('feedback')||document.getElementById('mFeed');if(el){el.className=(el.id==='feedback'?'feedback':'mFeed')+(ok?' ok':'');el.textContent=txt}}
function pick(i){
 if(locked)return;
 const s=scenes[state.scene],fb=document.getElementById('feedback');
 if(!curOpts[i][1]){state.wrong++;hud();store();fb.className='feedback';fb.textContent='⚠️ 틀렸어요! 표지판을 다시 보려면 Sorry? 버튼을 누르세요.';return}
 locked=true;
 const dg=digitFor(state.scene);
 if(dg!==null&&state.digits.length===s.slot)state.digits.push(dg);
 hud();
 fb.className='feedback ok';
 fb.textContent=dg!==null?`✨ 정답! 비밀 숫자 ${dg} 을(를) 얻었어요. 지금 꼭 적어 두세요!`:'✨ 정답! 길이 열렸어요.';
 if(dg!==null)showDigit(dg,s.slot);
 const isLast=state.scene==='harbor';
 document.getElementById('options').innerHTML=`<button class="btn" onclick="${isLast?'end()':'nextLeg()'}">${isLast?'⛵ 배에 올라타 탈출하기!':'🗺️ 지도에서 다음 길 찾기 ➜'}</button>`;
 store();
}
function showDigit(d,slot){
 const old=document.getElementById('digOv');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov digOv';ov.id='digOv';
 ov.innerHTML=`<div class="sheet digSheet">
   <p class="digTop">${slot+1}번째 비밀 숫자</p>
   <div class="digBig">${d}</div>
   <p class="digWarn">✏️ 지금 종이에 적어 두세요!<br><b>이 숫자는 다시 보여 주지 않아요.</b></p>
   <p class="digSub">네 숫자를 모두 모으면 탈출문이 열려요. (${slot+1}/4)</p>
   <button class="btn" onclick="closeDigit()">적었어요!</button>
  </div>`;
 document.body.appendChild(ov);
}
function closeDigit(){const o=document.getElementById('digOv');if(o)o.remove()}
let padIn=[];
function keypadHTML(){
 padIn=[];
 return `<div class="pad">
  <div class="padBoxes" id="padBoxes">${[0,1,2,3].map(i=>`<span class="padBox" id="pb${i}"></span>`).join('')}</div>
  <div class="padKeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="padKey" onclick="padPress(${n})">${n}</button>`).join('')}
   <button class="padKey wide" onclick="padClear()">지우기</button>
   <button class="padKey" onclick="padPress(0)">0</button>
   <button class="padKey go" onclick="unlock()">🔓 열기</button></div></div>`;
}
function padPaint(){
 for(let i=0;i<4;i++){const b=document.getElementById('pb'+i);if(b){b.textContent=padIn[i]!==undefined?padIn[i]:'';b.classList.toggle('on',padIn[i]!==undefined)}}
}
function padPress(n){
 if(padIn.length>=4)return;
 padIn.push(n);padPaint();
 const fb=document.getElementById('feedback');if(fb){fb.className='feedback';fb.textContent=''}
}
function padClear(){padIn=[];padPaint();const fb=document.getElementById('feedback');if(fb){fb.className='feedback';fb.textContent=''}}
function unlock(){
 const v=padIn.join(''),fb=document.getElementById('feedback');
 if(state.digits.length<4){fb.className='feedback';fb.textContent='🔒 아직 숫자 4개를 다 모으지 못했어요!';return}
 if(v.length<4){fb.className='feedback';fb.textContent='🔢 숫자 4개를 모두 눌러 주세요.';return}
 if(v!==state.digits.join('')){state.wrong++;hud();store();padClear();fb.className='feedback';fb.textContent='🔒 코드가 틀렸어요. 적어 둔 숫자를 순서대로 눌러 보세요.';return}
 fb.className='feedback ok';fb.textContent='🔓 문이 열렸습니다!';
 document.getElementById('options').innerHTML=`<button class="btn" onclick="nextLeg()">🚪 열린 문으로 나가기 ➜</button>`;
 store();
}
function nextLeg(){
 state.leg++;state.phase='travel';store();render();
}
function toTravel(){state.phase='travel';store();render()}

/* ==================== 엔딩 ==================== */
function end(){state.finished=true;store();ending()}

let endDone=false,endTimer=null;
function endFade(){
 if(endDone)return;endDone=true;
 clearTimeout(endTimer);
 const st=document.getElementById('endStage'),af=document.getElementById('endAfter');
 if(!st||!af)return;
 st.classList.add('fading');
 setTimeout(()=>{const s=document.getElementById('endStage');if(s)s.classList.add('gone')},1500);
 setTimeout(()=>{const a=document.getElementById('endAfter');if(a){a.classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}},900);
}
function ending(){
 setMusic('ending');
 endDone=false;clearTimeout(endTimer);
 const rescued=eatenList().length;saveEaten([]);
 const t=Math.max(1,Math.round((Date.now()-state.started)/1000));
 counter.textContent='🎉 탈출 성공';
 root.innerHTML=`<div class="intro endWrap">
  <div class="ending" id="endStage" onclick="endFade()">
   <video class="endVid" id="endVid" autoplay muted playsinline preload="auto" aria-label="배를 타고 섬을 떠나는 장면"><source src="video/ending_sail.webm" type="video/webm"><source src="video/ending_sail.mp4" type="video/mp4"></video>
   <h2 class="endTitle">${characters[state.char][0]}의 대탈출!</h2>
   <p class="endSkip">화면을 누르면 바로 결과를 볼 수 있어요</p></div>
  <div class="endAfter" id="endAfter">
   <h1 class="title">🎉 인어섬 탈출 성공!</h1>
   <p class="subtitle">영어 표지판을 모두 읽어내고 비밀의 문을 열어 섬을 탈출했어요!${rescued?'<br>🍣➜🐾 초밥이 되었던 친구 '+rescued+'명도 모두 구출했어요!':''}<br>
   ⏱️ ${Math.floor(t/60)}분 ${t%60}초 · 🧭 ${state.moves}회 이동 · ❌ 잘못 든 길/오답 ${state.wrong}회 · 🔑 비밀코드 ${state.digits.join('')}</p>
   <p class="subtitle" style="font-size:13px;color:#7b94a3">비밀코드는 캐릭터마다 달라요. 다른 친구로 하면 새 숫자를 모아야 해요!</p>
   <div class="actions" style="justify-content:center"><button class="btn" onclick="localStorage.removeItem(SAVE);home()">🔄 다른 캐릭터로 다시 하기</button><button class="btn alt" onclick="window.print()">🖨️ 결과 인쇄</button></div>
  </div></div>`;
 const v=document.getElementById('endVid');
 if(v){v.addEventListener('ended',endFade,{once:true});v.play().catch(()=>{})}
 // 영상이 없거나 재생되지 않아도 결과로 넘어가도록 보조 타이머
 endTimer=setTimeout(endFade,10000/(window.__fast||1));
}

/* ==================== 그림 표지판 (손그림 이미지) ==================== */
const PICS={forest:1,crossroads:1,cave:1,deepcave:1,lagoon:1,reef:1,temple:1,maze:1,harbor:1};
const SIGN_ALT={
 forest:'큰 나무 뒤를 가리키는 화살표가 그려진 표지판',
 crossroads:'폭포 뒤 동굴을 가리키는 화살표가 그려진 표지판',
 cave:'파란 수정 옆에 열쇠가 놓인 그림 표지판',
 deepcave:'두 바위 사이에 문이 있는 그림 표지판',
 lagoon:'작은 배 앞에 조개가 놓인 그림 표지판',
 reef:'1·2·3번 거북이 배 중 3번이 신전으로 가는 그림 표지판',
 temple:'두 석상 사이에 문이 있는 그림 표지판',
 maze:'1 왼쪽, 2 직진, 3 오른쪽 화살표가 그려진 표지판',
 harbor:'배를 타고 바다 건너 학교로 가는 그림 표지판'};
function picIMG(id){return `<img src="signs/${id}.webp" alt="${SIGN_ALT[id]||'그림 단서'}" draggable="false">`}

/* ==================== Sorry 단어 퀴즈 / 잡아먹힘 ==================== */
const EATEN='chiikawaEatenV5';
function eatenList(){try{const x=JSON.parse(localStorage.getItem(EATEN));if(Array.isArray(x))return x.filter(i=>characters[i])}catch(e){}return[]}
function saveEaten(l){try{localStorage.setItem(EATEN,JSON.stringify(l))}catch(e){}}
const WORDS=[['subway','지하철'],['taxi','택시'],['train','기차'],['boat','배 (보트)'],['behind','~ 뒤에'],['between','~ 사이에'],['museum','박물관'],['hospital','병원'],['library','도서관'],['school','학교'],['temple','신전'],['forest','숲'],['cave','동굴'],['beach','해변'],['island','섬'],['straight','곧장, 똑바로'],['left','왼쪽'],['right','오른쪽'],['number','번호, 숫자'],['park','공원'],['zoo','동물원']];
let quiz=null;
function onSorry(){
 state.signSorry=(state.signSorry||0)+1;store();
 if(state.signSorry===1){
  showSignFor(SIGN_T2);
  feedMsg('⏱️ 이번엔 5초! 다음에 또 물어보면 몬스터가 단어 문제를 내요.');
  return;
 }
 if(state.signSorry===2){openQuiz();return}
 beEaten(null);
}
function openQuiz(){
 const[word,mean]=WORDS[Math.floor(Math.random()*WORDS.length)];
 const nBlank=Math.min(2+(state.quizN||0),word.length);
 state.quizN=(state.quizN||0)+1;store();
 const idx=[...word].map((_,i)=>i);
 for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 const blanks=idx.slice(0,nBlank).sort((a,b)=>a-b);
 quiz={word,blanks};
 const mon=(state.phase==='scene'&&scenes[state.scene]&&scenes[state.scene].monster)||'elephant';
 const old=document.getElementById('quizOv');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';ov.id='quizOv';
 ov.innerHTML=`<div class="sheet quizSheet">
  <img class="quizMon" src="${img(mon)}" alt="몬스터">
  <h2>🍣 몬스터의 단어 문제!</h2>
  <p class="qWarn">틀리면 <b>잡아먹혀요!</b> 알파벳을 채워 단어를 완성하세요.</p>
  <div class="qMean">뜻: <b>${mean}</b></div>
  <div class="tiles" id="tiles">${[...word].map((ch,i)=>blanks.includes(i)
    ?`<input class="tile blank" maxlength="1" inputmode="latin" autocapitalize="off" autocomplete="off" data-i="${i}" aria-label="${i+1}번째 글자">`
    :`<span class="tile">${ch}</span>`).join('')}</div>
  <div class="actions" style="justify-content:center">
   <button class="btn" onclick="checkQuiz()">✅ 정답 확인</button>
   <button class="btn alt" onclick="closeQuiz(true)">안 볼래요 (취소)</button>
  </div></div>`;
 document.body.appendChild(ov);
 const ins=[...ov.querySelectorAll('input.tile')];
 ins.forEach((inp,k)=>{
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^a-zA-Z]/g,'');if(inp.value&&k<ins.length-1)ins[k+1].focus()});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&k>0)ins[k-1].focus();if(e.key==='Enter')checkQuiz()});
 });
 if(ins[0])ins[0].focus();
}
function closeQuiz(cancel){quiz=null;const o=document.getElementById('quizOv');if(o)o.remove();if(cancel&&state&&state.signSorry>=2){state.signSorry=1;store()}}
function checkQuiz(){
 if(!quiz)return;
 const ins=[...document.querySelectorAll('#quizOv input.tile')];
 if(ins.some(i=>!i.value))return;
 const ok=ins.every(i=>quiz.word[+i.dataset.i].toLowerCase()===i.value.toLowerCase());
 if(ok){
  closeQuiz();showSignFor(SIGN_T3);
  feedMsg('✨ Perfect! 표지판을 7초 동안 보여 줄게요.',true);
 }else{
  const word=quiz.word;closeQuiz();beEaten(word);
 }
}
function beEaten(word){
 const mon=(state.phase==='scene'&&scenes[state.scene]&&scenes[state.scene].monster)||'elephant';
 const me=characters[state.char];
 const l=eatenList();if(!l.includes(state.char))l.push(state.char);saveEaten(l);
 try{localStorage.removeItem(SAVE)}catch(e){}
 if(track)track.pause();
 playEatenSfx();
 const ov=document.createElement('div');ov.className='ov eatOv';ov.id='eatOv';
 ov.innerHTML=`<div class="eatStage">
   <img class="eatHero" src="${img(me[1])}" alt="${me[0]}">
   <img class="eatMon" src="${img(mon)}" alt="몬스터">
   <img class="eatSushi" src="${img('sushi_'+me[1])}" alt="초밥이 된 ${me[0]}">
   <div class="eatText"><b>냠냠!</b> ${word?`정답은 <b>${word}</b>…`:'표지판을 너무 많이 물어봤어요…'}<br>${me[0]}${/[가-힣]$/.test(me[0])&&((me[0].charCodeAt(me[0].length-1)-44032)%28>0)?'이':'가'} 잡아먹혀 초밥이 되고 말았어요! 🍣</div>
   <button class="btn eatBtn" onclick="afterEaten()">😢 다른 친구로 다시 도전하기</button>
  </div>`;
 document.body.appendChild(ov);
}
function afterEaten(){stopEatenSfx();const o=document.getElementById('eatOv');if(o)o.remove();state=null;home()}
function rescueAll(){saveEaten([]);home()}

/* ==================== 음악 ==================== */
let musicOn=false,area='calm',track=null,eatenSfx=null;
function playEatenSfx(){try{stopEatenSfx();eatenSfx=new Audio('music/eaten.mp3');eatenSfx.volume=.55;eatenSfx.play().catch(()=>{})}catch(e){}}
function stopEatenSfx(){if(eatenSfx){eatenSfx.pause();eatenSfx=null}if(musicOn)playTrack()}
const tracks={calm:'music/calm.m4a',monster:'music/monster.m4a',ending:'music/ending.m4a'};
function setMusic(mood){area=mood;if(musicOn)playTrack()}
function playTrack(){if(!musicOn)return;const src=tracks[area]||tracks.calm;
 if(track&&track.dataset.src===src&&!track.paused)return;
 if(track){track.pause();track.currentTime=0}
 track=new Audio(src);track.dataset.src=src;track.loop=area!=='ending';track.volume=area==='monster'?.38:.34;
 track.play().catch(()=>{document.getElementById('music').textContent='🔇 재생하려면 음악 버튼을 누르세요'});
}
function startAudio(){if(musicOn)playTrack()}
function toggleMusic(){musicOn=!musicOn;document.getElementById('music').textContent=musicOn?'🔊 음악 끄기':'🔇 음악 켜기';if(musicOn)playTrack();else if(track)track.pause()}

window.G={get state(){return state},get quiz(){return quiz},get curOpts(){return curOpts},nodes,legs,paths,scenes,go,pick,nextLeg,eatenList};
home();
</script></body></html>
